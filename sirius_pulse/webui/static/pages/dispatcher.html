<div class="dispatcher-page" id="dispatcherPage">
  <div class="dispatcher-toolbar">
    <div>
      <div class="dispatcher-eyebrow"><span class="dispatcher-signal-dot"></span> DISPATCH CONTROL</div>
      <h2 class="dispatcher-heading">群聊调度</h2>
      <p class="dispatcher-subtitle">跨人格共享租约 · 单群单轮 · 人类优先</p>
    </div>
    <div class="dispatcher-toolbar-actions">
      <span class="dispatcher-connection" id="dispatcherConnection">连接中</span>
      <button class="btn btn-sm" id="dispatcherRefresh" title="刷新调度器状态">↻ 刷新</button>
    </div>
  </div>

  <div class="stat-grid dispatcher-stat-grid" id="dispatcherStats">
    <div class="stat-card dispatcher-stat-card dispatcher-stat-live">
      <div class="stat-label">活跃租约</div>
      <div class="stat-value" id="dispatchActiveTurns">—</div>
      <div class="stat-detail">当前正在生成的群</div>
    </div>
    <div class="stat-card dispatcher-stat-card">
      <div class="stat-label">在线人格</div>
      <div class="stat-value" id="dispatchOnlineWorkers">—</div>
      <div class="stat-detail" id="dispatchWorkerDetail">等待心跳</div>
    </div>
    <div class="stat-card dispatcher-stat-card">
      <div class="stat-label">受控群组</div>
      <div class="stat-value" id="dispatchGroups">—</div>
      <div class="stat-detail">最近 24 小时有决策记录</div>
    </div>
    <div class="stat-card dispatcher-stat-card">
      <div class="stat-label">已送达回复</div>
      <div class="stat-value" id="dispatchSent">—</div>
      <div class="stat-detail">最近 24 小时</div>
    </div>
  </div>

  <div class="dispatcher-primary-grid">
    <section class="card dispatcher-live-card">
      <div class="card-header">
        <div>
          <div class="card-title">实时租约</div>
          <div class="card-subtitle">同一群组只允许一个人格持有发送权</div>
        </div>
        <span class="dispatcher-live-count" id="dispatcherLiveCount">0 个活跃</span>
      </div>
      <div id="dispatcherLiveTurns" class="dispatcher-live-turns"></div>
    </section>

    <section class="card dispatcher-policy-card">
      <div class="card-header">
        <div>
          <div class="card-title">调度策略</div>
          <div class="card-subtitle">从人格 Adapter 配置读取</div>
        </div>
        <span class="dispatcher-policy-state" id="dispatcherPolicyState">—</span>
      </div>
      <div id="dispatcherPolicy" class="dispatcher-policy-list"></div>
      <div class="dispatcher-source" id="dispatcherSource">—</div>
    </section>
  </div>

  <div class="dispatcher-secondary-grid">
    <section class="card dispatcher-groups-card">
      <div class="card-header">
        <div>
          <div class="card-title">群组占用</div>
          <div class="card-subtitle">按当前租约和最近回复排序</div>
        </div>
      </div>
      <div class="dispatcher-table-wrap">
        <table class="dispatcher-table">
          <thead>
            <tr><th>群组</th><th>当前人格</th><th>状态</th><th>最近人类消息</th><th>Peer 轮次</th></tr>
          </thead>
          <tbody id="dispatcherGroups"></tbody>
        </table>
      </div>
    </section>

    <section class="card dispatcher-events-card">
      <div class="card-header">
        <div>
          <div class="card-title">决策流</div>
          <div class="card-subtitle">最近一次 admission 结果</div>
        </div>
      </div>
      <div id="dispatcherEvents" class="dispatcher-events"></div>
    </section>
  </div>

  <section class="card dispatcher-workers-card">
    <div class="card-header">
      <div>
        <div class="card-title">人格 Worker</div>
        <div class="card-subtitle">注册表心跳与群组回复分布</div>
      </div>
      <span class="dispatcher-worker-note" id="dispatcherWorkerNote">—</span>
    </div>
    <div id="dispatcherWorkers" class="dispatcher-worker-list"></div>
  </section>
</div>
